# Local development: runs Postgres and the Silo server on this machine.
# The server is only published on 127.0.0.1, so nothing outside this computer can reach it.
services:
  db:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: silo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-silo-dev-only}
      POSTGRES_DB: silo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silo"]
      interval: 2s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgres://silo:${POSTGRES_PASSWORD:-silo-dev-only}@db:5432/silo
      HOST: 0.0.0.0
      PORT: 8443
      # Other addresses to publish, most preferred first (comma separated).
      PUBLIC_URLS: ${PUBLIC_URLS:-}
      # Publishes the onion address once the tor service has created it.
      ONION_HOSTNAME_FILE: /onion/hostname
      # Keeps the server's identity secret out of the database and its backups.
      SERVER_KEY_FILE: /keys/server.key
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - onion-name:/onion:ro
      - server-keys:/keys
    # The server needs no privileges and writes nothing but its key file.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy

  # Makes the server reachable as a Tor onion service, with no ports opened on this machine.
  # Turn it on with: docker compose --profile tor up --build
  tor:
    profiles: ["tor"]
    build: tools/tor
    volumes:
      - tor-keys:/var/lib/tor
      - onion-name:/shared
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - server

volumes:
  db-data:
  # The onion service's private keys. Back this up to keep the same onion address.
  tor-keys:
  onion-name:
  # The server's identity key. Back it up: losing it means every client sees a new, untrusted server.
  server-keys:
