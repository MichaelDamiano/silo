name: Release

# Builds the desktop app on each platform from a version tag and attaches the
# files, with checksums, to a draft GitHub release. A maintainer reviews the
# draft and publishes it. Builds are unsigned until signing keys are set up.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependency cache in release builds, so a poisoned cache cannot reach a release.
      - run: npm ci
      - run: npm run build -w @silo/protocol -w @silo/signal
      - run: npm run dist -w @silo/desktop
      - run: node apps/desktop/scripts/checksums.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: silo-${{ matrix.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.tar.gz
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/SHA256SUMS-*.txt

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat out/SHA256SUMS-*.txt > out/SHA256SUMS.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Silo $TAG" --notes "Check a download with: npm run verify-release -w @silo/desktop -- <file>. See docs/reproducible-builds.md." \
            out/*
