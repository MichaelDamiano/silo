name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: silo
          POSTGRES_PASSWORD: silo
          POSTGRES_DB: silo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U silo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      TEST_DATABASE_URL: postgres://silo:silo@localhost:5432/silo_test
    steps:
      # Actions are pinned to full commit SHAs, so a moved tag can't change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail on known high or critical vulnerabilities in anything that ships.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build -w @silo/protocol && npm run build -w @silo/signal
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    # Builds the Linux desktop app and checks its lockdown: fuses, and nothing extra shipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @silo/protocol -w @silo/signal
      - run: npm run dist -w @silo/desktop -- --linux dir
      - run: node apps/desktop/scripts/check-package.mjs
